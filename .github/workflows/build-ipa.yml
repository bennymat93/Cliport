# Builds the unsigned Cliport IPA on a GitHub-hosted Mac (no Mac or Apple developer account needed).
# Push the repository to GitHub, open Actions -> "Build unsigned IPA" -> Run workflow, then download the artifact.
name: Build unsigned IPA
on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - "dist/**"
      - "docs/*.pdf"
      - ".github/workflows/build-ipa.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (no code signing)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Cliport.xcodeproj -scheme Cliport -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -n 60

      - name: Report compile errors
        if: failure()
        working-directory: ios
        run: |
          # one combined annotation (GitHub caps separate error annotations at 10 per step)
          errs=$(grep -E "error:" build.log | sed "s#$PWD/##" | sort -u | head -n 60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          if [ -z "$errs" ]; then errs=$(tail -n 25 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'); fi
          echo "::error title=Build errors::${errs}"

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Cliport.app Payload/
          zip -qry Cliport-v1.0-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Cliport-v1.0-unsigned-ipa
          path: ios/Cliport-v1.0-unsigned.ipa

      # Downloads page: https://github.com/<owner>/<repo>/releases/latest
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/Cliport-Setup.exe Cliport-v1.0-Setup.exe
          cp dist/Cliport.exe Cliport-v1.0-portable.exe
          cp ios/Cliport-v1.0-unsigned.ipa Cliport-v1.0-unsigned.ipa
          FILES="Cliport-v1.0-Setup.exe Cliport-v1.0-portable.exe Cliport-v1.0-unsigned.ipa docs/Cliport-User-Guide-he.pdf docs/Cliport-User-Guide-en.pdf"
          if gh release view v1.0 >/dev/null 2>&1; then
            gh release upload v1.0 $FILES --clobber
          else
            gh release create v1.0 $FILES --title "Cliport v1.0" --notes "Windows: Cliport-v1.0-Setup.exe (installer) or Cliport-v1.0-portable.exe (no installation). iPhone / iPad: Cliport-v1.0-unsigned.ipa (unsigned, for sideloading). User guides: Hebrew and English PDF."
          fi
