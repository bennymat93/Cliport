# XcodeGen project description (https://github.com/yonaskolb/XcodeGen).
# Generate the Xcode project with:  xcodegen generate
name: Cliport
options:
  bundleIdPrefix: com.cliport
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  Cliport:
    type: application
    platform: iOS
    sources:
      - Cliport
    info:
      path: Cliport/Info.plist
      properties:
        CFBundleDisplayName: Cliport
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: he
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        LSApplicationQueriesSchemes:
          - rdp
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cliport.app
        PRODUCT_NAME: Cliport
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: "NO"
  # Automated tests (simulator only; see .github/workflows/test-ios.yml). They are not part of the IPA.
  CliportTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CliportTests
      - TestSupport
    dependencies:
      - target: Cliport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cliport.tests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) HOSTED"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Cliport.app/Cliport"
        BUNDLE_LOADER: "$(TEST_HOST)"
  CliportUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - CliportUITests
      - TestSupport
      # the protocol pieces, compiled into the test runner so it can act as a second device
      - path: Cliport/Core.swift
      - path: Cliport/Mqtt.swift
    dependencies:
      - target: Cliport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cliport.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: Cliport
schemes:
  Cliport:
    build:
      targets:
        Cliport: all
    test:
      targets:
        - CliportTests
        - CliportUITests
